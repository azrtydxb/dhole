syntax = "proto3";

package dhole.v1;

import "dhole/v1/common.proto";
import "dhole/v1/engine.proto";
import "dhole/v1/pipeline.proto";

option go_package = "github.com/azrtydxb/dhole/gen/dhole/v1;dholev1";

// AddStep introduces a step. The step's id is its identity for the life of
// the pipeline; nothing else may be reused to mean a different step.
message AddStep {
  Step step = 1;
}

// RemoveStep takes a step out again.
//
// It exists because the editing vocabulary has to be CLOSED UNDER INVERSION.
// Every operation returns the operation that undoes it, and without a removal
// there is nothing an add_step could return: undo would stop being a property
// of the API and become something each client reimplements, which is exactly
// what ADR 0013 refuses.
//
// A step that still has edges is refused rather than removed together with
// them, so that the inverse of a removal is a plain add_step and not an
// add_step plus a set of reconnections whose order would matter.
message RemoveStep {
  string step_id = 1;
}

// Connect adds an edge from one step's output port to another's input port.
// The DAG is these edges; there is no separate dependency list to drift.
message Connect {
  Edge edge = 1;
}

// RemoveEdge deletes an edge. It is the exact inverse of Connect, and Connect
// of it.
message RemoveEdge {
  Edge edge = 1;
}

// SetProperty changes one scalar property of one step. The property is named
// by its protobuf field name — "plugin_ref", "effect_class", "lease_scope" —
// and the value is its text form, so an enum travels as its declared name
// rather than an integer nobody can read in an audit log.
message SetProperty {
  string step_id = 1;
  string property = 2;
  string value = 3;
}

// SetStepConfig sets or removes one value a step passes to its plugin.
//
// One key at a time, and not a whole map, so that every edit has an exact
// inverse expressible as another SetStepConfig (ADR 0020): setting a key that
// was absent inverts to removing it, setting one that had a value inverts to
// restoring that value, and removing one inverts to setting it back.
//
// Removing a key that is not there is REFUSED, for the same reason removing an
// edge that does not exist is: the "inverse" of a removal that removed nothing
// would set a value the step never had, so undoing it would add something.
message SetStepConfig {
  string step_id = 1;
  // The field name, as the plugin's input schema declares it.
  string key = 2;
  string value = 3;
  // Remove the key instead of setting it. value is ignored.
  bool remove = 4;
}

// Rename changes a step's display name.
//
// Any name is accepted, the empty one included: a name is a label and the id
// is the identity, and refusing the empty name would make the inverse of
// naming a previously unnamed step inexpressible.
message Rename {
  string step_id = 1;
  string name = 2;
}

// Operation is one edit. The GUI emits one per interaction; the CLI and an
// agent emit exactly the same ones. There is no document-level write: an
// editor that sends whole documents cannot merge concurrent edits and cannot
// undo (ADR 0013).
message Operation {
  oneof kind {
    AddStep add_step = 1;
    Connect connect = 2;
    SetProperty set_property = 3;
    RemoveEdge remove_edge = 4;
    Rename rename = 5;
    RemoveStep remove_step = 6;
    SetStepConfig set_step_config = 7;
  }
}

// ChangeKind is what happened to one element of the pipeline.
enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ADDED = 1;
  CHANGE_KIND_REMOVED = 2;
  CHANGE_KIND_CHANGED = 3;
}

// Change is one element the operation touched. Exactly one of step_id and
// edge is populated: a change that names neither describes nothing.
message Change {
  ChangeKind kind = 1;
  string step_id = 2;
  Edge edge = 3;
  // Human-readable, and it names the step or the edge it is about, because
  // this string is what a GUI shows and what an agent quotes back.
  string summary = 4;
}

// Diff is what an operation changed.
message Diff {
  repeated Change changes = 1;
}

// Revision is one immutable definition of a pipeline, as the wire sees it.
message Revision {
  string id = 1;
  string pipeline_id = 2;
  string content_hash = 3;
  // draft, reviewed or active.
  string state = 4;
  // Plugin reference to pinned digest.
  map<string, string> lockfile = 5;
  string author = 6;
  string approver = 7;
}

// GetPipelineRequest asks for one revision of one pipeline. An empty
// revision_id means the pipeline's current editing head.
message GetPipelineRequest {
  string pipeline_id = 1;
  string revision_id = 2;
}

// GetPipelineResponse carries the definition and the revision it came from.
message GetPipelineResponse {
  Pipeline pipeline = 1;
  Revision revision = 2;
}

// CreatePipelineRequest creates a pipeline and writes its first revision.
//
// It is a separate RPC rather than an ApplyOperation with an empty base,
// because an empty base_revision is a REFUSAL and has to stay one: an edit
// that cannot conflict silently overwrites whatever someone else wrote. A
// client that lost track of its base would then be indistinguishable from one
// asking to start something new, which is exactly the case where the
// difference matters most. Creation says so in its own name.
message CreatePipelineRequest {
  string pipeline_id = 1;
  // The definition to start from. Optional: the empty pipeline is the normal
  // case, because everything after it is an Operation like any other. Its own
  // id and tenant are ignored — the id is pipeline_id and the tenant comes
  // from the credential, never from the request.
  Pipeline pipeline = 2;
}

// CreatePipelineResponse is the new pipeline and the revision an edit may be
// based on. It is the same shape GetPipeline answers with, so a client can
// create and then edit without a second read.
message CreatePipelineResponse {
  Pipeline pipeline = 1;
  Revision revision = 2;
}

// ApplyOperationRequest applies one edit to the revision the caller last saw.
// base_revision is mandatory: an edit that cannot conflict is an edit that
// silently overwrites someone else's.
message ApplyOperationRequest {
  string pipeline_id = 1;
  string base_revision = 2;
  Operation operation = 3;
}

// ApplyOperationResponse is the new revision, what changed, and the operation
// that undoes it.
message ApplyOperationResponse {
  Revision revision = 1;
  Diff diff = 2;
  // inverse applied to revision yields the definition base_revision held.
  Operation inverse = 3;
  // The resulting definition, so an editor need not fetch what it just wrote.
  Pipeline pipeline = 4;
}

// ValidateRequest asks for structured diagnostics on a revision, or on a
// definition the caller has not saved yet.
message ValidateRequest {
  string pipeline_id = 1;
  string revision_id = 2;
  Pipeline pipeline = 3;
}

// Diagnostic is one problem, positioned at the step and port it is about.
message Diagnostic {
  // "error" or "warning".
  string severity = 1;
  string message = 2;
  string step_id = 3;
  string port = 4;
}

// ValidateResponse is every diagnostic found. An empty list means the
// definition is well-formed.
message ValidateResponse {
  repeated Diagnostic diagnostics = 1;
}

// PlanRequest asks what a run of this revision would do, without doing any of
// it.
message PlanRequest {
  string pipeline_id = 1;
  string revision_id = 2;
}

// PlannedStep is one step of a dry run: whether it would be served from cache,
// which kind of engine it would land on, and — when it would not be cached —
// why not.
message PlannedStep {
  string step_id = 1;
  bool cache_hit = 2;
  string engine_kind = 3;
  string non_cacheable_reason = 4;
}

// PlanResponse is the dry run.
message PlanResponse {
  repeated PlannedStep steps = 1;
}

// ListRevisionsRequest asks for a pipeline's revision history.
message ListRevisionsRequest {
  string pipeline_id = 1;
}

// ListRevisionsResponse is that history, oldest first.
message ListRevisionsResponse {
  repeated Revision revisions = 1;
}

// ApproveRevisionRequest promotes a revision to active. The approver is the
// authenticated caller and is never taken from the request.
message ApproveRevisionRequest {
  string revision_id = 1;
}

// ApproveRevisionResponse is the revision as it now stands.
message ApproveRevisionResponse {
  Revision revision = 1;
}

// StartRunRequest starts a run. An empty revision_id means the pipeline's
// active revision; a revision that is not active is refused.
message StartRunRequest {
  string pipeline_id = 1;
  string revision_id = 2;
}

// StartRunResponse names the new run and the revision it pinned.
message StartRunResponse {
  string run_id = 1;
  string revision_id = 2;
}

// WatchRunRequest follows one run.
message WatchRunRequest {
  string run_id = 1;
}

// WatchRunResponse is one entry of the run's event log — the run's only position
// (ADR 0003). The stream replays the log from its beginning and then follows
// it, so a client that connects late misses nothing.
message WatchRunResponse {
  string run_id = 1;
  string step_id = 2;
  uint32 attempt = 3;
  uint64 sequence = 4;
  // The stored event type, e.g. "STEP_DISPATCHED".
  string type = 5;
  bytes payload = 6;
  int64 at_unix_nano = 7;
}

// DecideApprovalRequest answers one approval gate of one run.
//
// It carries no approver. The approver is the principal the credential
// authenticated, exactly as ApproveRevision's is — and the two are different
// acts that are easy to confuse: ApproveRevision promotes a DEFINITION to
// active before anything runs, while this decides a gate a RUN is sitting at.
// A run can only be released by someone this control plane authenticated, and
// an approver a caller could type is an approver a caller could forge.
message DecideApprovalRequest {
  string run_id = 1;
  // The step whose gate is being decided. A run may hold more than one.
  string step_id = 2;
  // Approve, releasing the run; or deny, which fails it. A denial is a
  // decision rather than a pause: a run that stopped for no stated reason is
  // the worst possible record of one.
  bool approved = 3;
}

// DecideApprovalResponse is the decision as it was recorded, including the
// approver the credential resolved to — which is what the caller could not
// have chosen and therefore the one field worth reading back.
message DecideApprovalResponse {
  string run_id = 1;
  string step_id = 2;
  string approver = 3;
  bool approved = 4;
}

// GetPluginRequest asks the catalog what one published plugin declares.
message GetPluginRequest {
  // "namespace/name@version". A version is mandatory: dispatch resolves to an
  // exact version and digest, so a floating reference has no meaning here.
  string plugin_ref = 1;
}

// Plugin is a published type's declaration, as internal/catalog holds it.
//
// It reaches clients because a properties panel, an agent's tool discovery and
// an editor's autocomplete are all the same question — what does this plugin
// take? — and the answer has one source (ADR 0012). Before this RPC the
// browser could not ask it at all, and rendered whatever schema the DEFINITION
// happened to carry inline, which is a copy of the declaration free to be
// stale.
message Plugin {
  // The canonical reference, "namespace/name@version".
  string ref = 1;
  string namespace = 2;
  string name = 3;
  string version = 4;
  Digest digest = 5;
  // step, trigger or engine.
  string kind = 6;
  EffectClass effect_class = 7;
  repeated Capability capabilities = 8;
  // JSON Schema source, as the plugin author published it. Empty when the
  // plugin declares none.
  string input_schema = 9;
  string output_schema = 10;
  // Executor kinds that can run it, e.g. "process", "container".
  repeated string engine_types = 11;
}

// GetPluginResponse is that declaration.
message GetPluginResponse {
  Plugin plugin = 1;
}

// PublishPluginRequest puts one type's declaration into the caller's catalog.
//
// Publishing is on the contract because it is the only supported way in.
// Before this RPC nothing anywhere published: not the API, not the CLI, not
// the git mirror, so a declaration could be READ through GetPlugin and could
// only be PUT there by a process holding the control plane's own database
// open — a capability the GUI and an agent can never have, which is exactly
// what ADR 0013 refuses.
//
// The tenant is the credential's, like everywhere else: a caller can say what
// it publishes, never whose catalog it lands in.
message PublishPluginRequest {
  // The declaration. Its `ref` field is ignored on the way in — the reference
  // is namespace/name@version, and a ref that disagreed with them would be a
  // second, contradicting identity for the same record.
  Plugin plugin = 1;
}

// PublishPluginResponse is the declaration as the catalog now holds it,
// including the canonical ref it is addressed by from here on.
message PublishPluginResponse {
  Plugin plugin = 1;
}

// Trigger is one configured event source, as the contract carries it.
//
// It is on the contract because it was not: triggers could only be declared on
// the plane's own configuration file and read at start-up by `--triggers`, so
// creating one was a capability reserved for whoever could edit a file on the
// control plane's host and restart it. The GUI and an agent can do neither,
// which is exactly what ADR 0013 refuses. A trigger binds to a pipeline's
// typed inputs (ADR 0007), and the binding is checked when the trigger is
// CREATED rather than at 3am inside the first step of a run that should never
// have started.
message Trigger {
  // Identity within the tenant. A schedule's id is the key of its row, so two
  // planes running the same id run ONE schedule between them.
  string id = 1;
  // "schedule", "http" or "git".
  string kind = 2;
  // The pipeline this trigger drives. Its ACTIVE revision is resolved when
  // the trigger fires, never pinned when it is created.
  string pipeline_id = 3;
  // Each of the pipeline's declared inputs to the field of this trigger's own
  // event that fills it. The pipeline's vocabulary is the stable one.
  map<string, string> input_mapping = 4;
  // A five- or six-field cron expression. Schedules only.
  string expression = 5;
  // Mark every value this trigger produces as tainted (ADR 0015).
  bool untrusted = 6;
  // The shared secret a forge signs its webhooks with. Git triggers only, and
  // required for them: an endpoint that can verify nothing is an
  // unauthenticated way to start somebody's pipeline.
  //
  // WRITE-ONLY. It is never returned by ListTriggers — a contract that read
  // back the secret it was given would make every credential-listing client a
  // way to exfiltrate it. has_secret says whether one is held.
  string secret = 7;
  // Read-only: this trigger is DECLARED in the plane's `--triggers` file
  // rather than stored. A declared trigger wins over a stored one of the same
  // id and cannot be changed or deleted through this contract, because the
  // file is what the next restart will read.
  bool declared = 8;
  // Read-only: a secret is held for this trigger.
  bool has_secret = 9;
}

// CreateTriggerRequest stores one trigger in the caller's tenant.
//
// The tenant is the credential's, like everywhere else. The binding is
// validated against the pipeline's active revision before anything is stored:
// a trigger naming an input the pipeline does not declare is a mistake made
// while wiring it up, and finding it now is worth far more than finding it in
// a run.
message CreateTriggerRequest {
  Trigger trigger = 1;
}

// CreateTriggerResponse is the trigger as it is now stored, without its
// secret.
message CreateTriggerResponse {
  Trigger trigger = 1;
}

// ListTriggersRequest asks for every trigger the caller's tenant has: the
// stored ones and the ones the plane's own configuration declares, so an
// operator mid-migration can see both and which is which.
message ListTriggersRequest {}

// ListTriggersResponse is those triggers, in id order and without secrets.
message ListTriggersResponse {
  repeated Trigger triggers = 1;
}

// DeleteTriggerRequest removes one stored trigger. A DECLARED trigger is
// refused: it lives in the plane's configuration file, and deleting the row
// would leave the file to put it back at the next restart.
message DeleteTriggerRequest {
  string trigger_id = 1;
}

// DeleteTriggerResponse is empty. The trigger is gone; there is nothing left
// to say about it.
message DeleteTriggerResponse {}

// CancelRunRequest stops a run.
//
// Cancellation is a control-plane act with an engine-side half: the run is
// closed in its own log, and every engine holding one of its steps is told to
// stop, because a sandbox nobody asked to stop keeps burning the capacity the
// cancellation was meant to free.
message CancelRunRequest {
  string run_id = 1;
  // Recorded on the run's log. Free text, and it is what an operator reads
  // months later when asking why a run stopped.
  string reason = 2;
}

// CancelledStep is one in-flight attempt cancellation reached.
message CancelledStep {
  string step_id = 1;
  uint32 attempt = 2;
  // The engine that was holding it and was told to stop.
  string engine_id = 3;
}

// CancelRunResponse is what the cancellation reached. An empty steps list
// means the run held nothing in flight, which is the normal case for a run
// that was waiting rather than running.
message CancelRunResponse {
  string run_id = 1;
  repeated CancelledStep steps = 2;
}

// Engine is one live engine instance as the control plane currently sees it.
// It is the registry's view (internal/registry.Instance) on the wire.
message Engine {
  string id = 1;
  // registering, ready, draining. A gone instance is not in the fleet.
  string state = 2;
  repeated Capability capabilities = 3;
  string os = 4;
  string arch = 5;
  uint32 slots = 6;
  repeated uint32 protocol_versions = 7;
  // What the engine's last heartbeat said it was holding.
  repeated InFlight in_flight = 8;
}

// ListEnginesRequest asks for the caller's tenant's fleet. It carries no
// tenant: the tenant comes from the credential, as it does everywhere here.
message ListEnginesRequest {}

// ListEnginesResponse is the live fleet, by engine id.
message ListEnginesResponse {
  repeated Engine engines = 1;
}

// DrainEngineRequest stops new work reaching one engine.
message DrainEngineRequest {
  string engine_id = 1;
}

// DrainEngineResponse is the instance as it now stands, or unset when the
// registry no longer holds it — an operator draining from a list a few seconds
// old is the normal case, and the engine being gone already is the outcome
// they wanted.
message DrainEngineResponse {
  Engine engine = 1;
}

// EngineService is the fleet, on the same contract as everything else.
//
// It exists because the CLI shipped `engine list` and `engine drain` as
// commands that refused: they could each have read internal/registry directly,
// and that is exactly what must not happen. A CLI able to list engines while
// the GUI and an agent cannot is the same failure as a GUI-only endpoint seen
// from the other side (ADR 0013).
//
// Every RPC is authenticated and tenant-scoped, like PipelineService's.
service EngineService {
  // ListEngines is the live fleet for the caller's tenant.
  rpc ListEngines(ListEnginesRequest) returns (ListEnginesResponse);
  // DrainEngine stops new work reaching an engine while it finishes what it
  // holds. It kills nothing: a drain that interrupted running work would make
  // every rolling upgrade an outage.
  rpc DrainEngine(DrainEngineRequest) returns (DrainEngineResponse);
}

// Cursor is where an editor's pointer is on the canvas, in the canvas's own
// coordinates. It is a hint for drawing and nothing else: no operation is
// expressed in these numbers, and no position ever reaches a definition.
message Cursor {
  double x = 1;
  double y = 2;
}

// PresenceEvent is one OTHER editor of a pipeline, as the editors watching it
// may draw them.
//
// It carries a handle and no more of the person than that. Everything else the
// control plane knows about a caller — the tenant, the kind of credential, the
// credential itself — stays on the control plane: drawing a cursor needs a
// label to put beside it, an opaque id to keep one person's two tabs apart,
// and what that editor has selected. The selection is a step id in a pipeline
// the recipient can already read, which is why it is not a disclosure; a field
// naming anything outside that pipeline would be.
message PresenceEvent {
  // The editor's display handle: the principal's subject, and nothing else.
  string principal = 1;
  // The step this editor has selected, empty when they have selected none.
  string selection = 2;
  Cursor cursor = 3;
  // Opaque, and per editing session rather than per person: one person in two
  // tabs is two sessions with two cursors.
  string session_id = 4;
  // This session has left; stop drawing it. A session that vanishes WITHOUT
  // saying so — a killed browser, a dropped connection — is reported gone by
  // everyone watching once its announcement stops being refreshed.
  bool gone = 5;
}

// WatchPresenceRequest follows who else is editing one pipeline.
//
// session_id is the caller's own session, and it ties this stream's lifetime
// to that session: when the stream ends, the session is announced gone. It is
// optional — a caller that only watches, and announces nothing, leaves it
// empty and is invisible to the others.
message WatchPresenceRequest {
  string pipeline_id = 1;
  string session_id = 2;
  // What this session has selected as it joins, and where its pointer is.
  //
  // They are here rather than left to a first UpdatePresence because the
  // subject is ephemeral: an announcement published before this stream has
  // subscribed is simply not there, and nothing would ever refresh it. Opening
  // the stream and announcing on it is one act, in one order, on one server.
  string selection = 3;
  Cursor cursor = 4;
}

// WatchPresenceResponse is one presence event. It wraps rather than repeats
// PresenceEvent, because the same message is what travels on the ephemeral
// subject between control planes: one shape, one meaning, wherever it is read.
message WatchPresenceResponse {
  PresenceEvent event = 1;
}

// UpdatePresenceRequest is one editor saying what it is doing now.
//
// The principal is NEVER taken from here: it comes from the credential, like
// everywhere else in this contract. A caller can say where its cursor is; it
// cannot say who it is.
message UpdatePresenceRequest {
  string pipeline_id = 1;
  string session_id = 2;
  string selection = 3;
  Cursor cursor = 4;
  // Leave, without waiting for the announcement to expire.
  bool gone = 5;
}

// UpdatePresenceResponse is empty: presence is fire-and-forget, and a field
// here would be state this call had accumulated somewhere.
message UpdatePresenceResponse {}

// PipelineService is the one API contract. The GUI has no privileged
// endpoints: it is one client of this service among the CLI and agents
// (ADR 0013). Every RPC is authenticated and tenant-scoped — the tenant comes
// from the credential and never from the request.
service PipelineService {
  // CreatePipeline creates a pipeline and its first revision. Nothing else
  // in this service can write a first revision, so without it the GUI could
  // not create a pipeline at all and every client had to reach around the
  // API to seed one.
  rpc CreatePipeline(CreatePipelineRequest) returns (CreatePipelineResponse);
  // GetPipeline reads one revision of one pipeline.
  rpc GetPipeline(GetPipelineRequest) returns (GetPipelineResponse);
  // ApplyOperation applies one edit and returns the diff and its inverse.
  rpc ApplyOperation(ApplyOperationRequest) returns (ApplyOperationResponse);
  // Validate returns structured diagnostics with source positions.
  rpc Validate(ValidateRequest) returns (ValidateResponse);
  // Plan is a dry run: what would execute, what is a cache hit, and which
  // engine each step lands on.
  rpc Plan(PlanRequest) returns (PlanResponse);
  // GetPlugin returns what one published plugin declares, which is what a
  // properties panel renders, an agent discovers tools from and an editor
  // completes against.
  rpc GetPlugin(GetPluginRequest) returns (GetPluginResponse);
  // PublishPlugin records a type's declaration in the caller's catalog. It is
  // the supported way to put one there; without it, GetPlugin read a store
  // nothing on the contract could write.
  rpc PublishPlugin(PublishPluginRequest) returns (PublishPluginResponse);
  // CreateTrigger stores an event source in the caller's tenant. Without it
  // triggers could only be declared in the plane's own configuration file and
  // read at start-up, so an operator without shell access to the control
  // plane's host could not create one at all (ADR 0013).
  rpc CreateTrigger(CreateTriggerRequest) returns (CreateTriggerResponse);
  // ListTriggers returns the tenant's triggers, stored and declared alike,
  // and never their secrets.
  rpc ListTriggers(ListTriggersRequest) returns (ListTriggersResponse);
  // DeleteTrigger removes one stored trigger.
  rpc DeleteTrigger(DeleteTriggerRequest) returns (DeleteTriggerResponse);
  // ListRevisions returns a pipeline's revision history.
  rpc ListRevisions(ListRevisionsRequest) returns (ListRevisionsResponse);
  // ApproveRevision promotes a revision to active.
  rpc ApproveRevision(ApproveRevisionRequest) returns (ApproveRevisionResponse);
  // StartRun starts a run of an approved revision.
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  // WatchRun streams a run's event log.
  rpc WatchRun(WatchRunRequest) returns (stream WatchRunResponse);
  // DecideApproval answers an approval gate a run is waiting at, as the
  // authenticated principal. Without it a human gate was decidable only
  // through the Go API, in-process — so the GUI, the CLI and an agent could
  // start a run they could not release, which is the ADR 0013 failure in its
  // purest form.
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);
  // CancelRun stops a run and tells every engine holding one of its steps to
  // stop too.
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  // WatchPresence streams who else is editing this pipeline. It is ephemeral
  // in both directions: nothing about presence is stored, and an editor that
  // stops refreshing its announcement is reported gone rather than remembered.
  rpc WatchPresence(WatchPresenceRequest) returns (stream WatchPresenceResponse);
  // UpdatePresence announces this editor's selection and cursor to the others.
  rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse);
}
