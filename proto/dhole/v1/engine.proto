syntax = "proto3";

package dhole.v1;

import "dhole/v1/common.proto";
import "dhole/v1/pipeline.proto";

option go_package = "github.com/azrtydxb/dhole/gen/dhole/v1;dholev1";

// InputRef points an engine at bytes it must fetch. The engine resolves it
// itself; the control plane never streams payloads through its own process.
message InputRef {
  // The port this input satisfies on the dispatched step.
  string port = 1;
  Digest digest = 2;
  // Key in the object store, when the bytes are not content-addressed.
  string key = 3;
}

// OutputRef is what a step produced, reported back by the engine.
message OutputRef {
  string port = 1;
  Digest digest = 2;
  string key = 3;
  uint64 size_bytes = 4;
}

// SecretRef is a short-lived, single-use handle an engine redeems for a secret
// value. Engines never receive secret values on the wire — a dispatch is
// replayable and archived, and a secret in it would be a secret at rest.
message SecretRef {
  // Environment variable or file name the redeemed value is bound to.
  string name = 1;
  // Opaque redemption handle, meaningless outside its TTL.
  string handle = 2;
  // Unix seconds after which the handle is refused.
  int64 expires_at = 3;
}

// JobDispatch is one unit of work handed to an engine. It is SELF-CONTAINED:
// everything needed to run the step is in this message or reachable from it,
// so an engine needs no callback into the control plane to begin, and a
// control-plane restart mid-flight loses nothing.
message JobDispatch {
  string run_id = 1;
  string step_id = 2;
  uint32 attempt = 3;
  // The lease fence held when this dispatch was issued. An engine echoes it
  // back on every status; a stale fence means a newer attempt owns the step.
  string fence_token = 4;
  Step step = 5;
  repeated InputRef inputs = 6;
  repeated SecretRef secrets = 7;
  // Object-store prefix the engine writes outputs and logs beneath.
  string output_prefix = 8;
  uint32 protocol_version = 9;
  Tenant tenant = 10;
  // Shell command the step runs, when the plugin is a plain command.
  repeated string command = 11;
  map<string, string> env = 12;
}

// Phase is where a job stands. Only terminal phases carry an exit code.
enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_ACCEPTED = 1;
  PHASE_RUNNING = 2;
  PHASE_SUCCEEDED = 3;
  PHASE_FAILED = 4;
  PHASE_CANCELLED = 5;
}

// JobStatus is an engine's report on a dispatch. The fence token it echoes is
// what lets the control plane ignore a report from a superseded attempt.
message JobStatus {
  string run_id = 1;
  string step_id = 2;
  uint32 attempt = 3;
  string fence_token = 4;
  Phase phase = 5;
  int32 exit_code = 6;
  repeated OutputRef outputs = 7;
  string error = 8;
  // Object-store key holding the authoritative, complete log for this attempt.
  string log_key = 9;
}

// Stream distinguishes the two output streams of a step.
enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

// LogChunk is a live log fragment. These are best-effort and ephemeral — they
// exist so a watching GUI sees output as it happens. The authoritative copy is
// the object named by JobStatus.log_key; a dropped chunk loses nothing durable.
message LogChunk {
  string run_id = 1;
  string step_id = 2;
  // Monotonic per (run, step, attempt), so a viewer can spot a gap.
  uint64 seq = 3;
  bytes data = 4;
  Stream stream = 5;
  uint32 attempt = 6;
}

// EngineRegistration is what an engine announces on start. The scheduler
// matches a step's requirements against exactly these fields.
message EngineRegistration {
  string engine_id = 1;
  // Every protocol version this engine can speak, so the control plane can
  // choose the highest both sides support.
  repeated uint32 protocol_versions = 2;
  repeated Capability capabilities = 3;
  string os = 4;
  string arch = 5;
  // How many jobs this engine will run concurrently.
  uint32 slots = 6;
  // Executor kinds this engine offers, e.g. "process", "container".
  repeated string engine_types = 7;
  // Trust tier this engine runs in; it may only receive work dispatched to it.
  string tier = 8;
}

// InFlight is one job an engine is currently running.
message InFlight {
  string run_id = 1;
  string step_id = 2;
  uint32 attempt = 3;
  string fence_token = 4;
}

// EngineHeartbeat proves an engine is alive and says what it is holding. A
// missed heartbeat is how the control plane learns a job was orphaned.
message EngineHeartbeat {
  string engine_id = 1;
  repeated InFlight in_flight = 2;
}

// Cancel stops one in-flight job.
message Cancel {
  string run_id = 1;
  string step_id = 2;
  uint32 attempt = 3;
  string fence_token = 4;
}

// Drain tells an engine to accept no new work and exit once idle.
message Drain {
  // Seconds to wait for in-flight work before giving up on a clean exit.
  uint32 deadline_seconds = 1;
}

// Attach asks an engine to open an interactive session against a running job.
message Attach {
  string run_id = 1;
  string step_id = 2;
  uint32 attempt = 3;
  // Ephemeral subject the engine serves the session on.
  string reply_subject = 4;
}

// EngineControl is the only inbound message an engine accepts. Engines are
// outbound-only otherwise: they dial the bus, nothing dials them.
message EngineControl {
  oneof kind {
    Cancel cancel = 1;
    Drain drain = 2;
    Attach attach = 3;
  }
}
