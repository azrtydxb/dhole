syntax = "proto3";

package dhole.v1;

import "dhole/v1/common.proto";

option go_package = "github.com/azrtydxb/dhole/gen/dhole/v1;dholev1";

// BlobType is an opaque byte stream, identified by content and carried by
// reference. Its media type is advisory; nothing type-checks against it.
message BlobType {
  // Advisory media type, e.g. "application/gzip". May be empty.
  string media_type = 1;
}

// StructType is data with a JSON Schema. Two structured ports are compatible
// when their schema ids match, which is what makes the editor able to reject a
// bad edge before a run starts.
message StructType {
  // The schema's "$id". This is the identity used for compatibility.
  string schema_id = 1;
  // The schema source, when the control plane carries it inline.
  string schema = 2;
}

// PortType is the type of one port. The oneof is the whole type system: a
// blob and a structured value never connect to each other.
message PortType {
  oneof kind {
    BlobType blob = 1;
    StructType structured = 2;
  }
}

// Port is one named input or output of a step. Ports are what the DAG is
// derived from — a step never reaches into a shared workspace.
message Port {
  string name = 1;
  PortType type = 2;
}

// Step is one unit of work: a plugin reference, its typed ports, the effect
// class that governs caching and retry, and the capabilities it requires.
message Step {
  string id = 1;
  string name = 2;
  // Scheme-addressed reference to the plugin that implements this step.
  string plugin_ref = 3;
  EffectClass effect_class = 4;
  repeated Port inputs = 5;
  repeated Port outputs = 6;
  repeated Capability capabilities = 7;
  // How long the sandbox this step runs in lives. Unspecified means
  // LEASE_SCOPE_STEP: a fresh sandbox, which is the only safe default because
  // every other scope carries state a cache key cannot see.
  LeaseScope lease_scope = 8;
  // The values this step passes to its plugin, keyed by the field name the
  // plugin's input schema declares.
  //
  // Strings, because that is what the schema-driven form produces and what a
  // command line carries; a plugin whose field is a number declares it as one
  // and the value is the text of that number. A typed value here would mean a
  // second type system beside JSON Schema, disagreeing with it at the edges.
  //
  // It exists because a field a plugin declares could be rendered and
  // validated and then had nowhere to go: set_property covers plugin_ref,
  // effect_class and lease_scope, and nothing else on a Step could hold what
  // the plugin actually takes. The map is part of the definition, so it is
  // part of the content hash and therefore part of the cache key — two runs
  // configured differently are two different pieces of work.
  map<string, string> config = 9;
  // Image the sandbox this step runs in is built from, as the executor's
  // backend understands it: an OCI reference for a container backend, ignored
  // by a backend that has no images at all.
  //
  // It exists because a pipeline could not say what its steps run in. The
  // executor's pod template did, so every step on one Kubernetes engine ran
  // the same image and the acceptance pipelines had to embed a Dockerfile's
  // text in a step to get a toolchain in.
  //
  // PIN IT TO A DIGEST if the step is to be cached. The cache key is hashed
  // against this reference, and the plane resolves nothing: a tag is a moving
  // target, so a step naming one has no stable environment identity and is
  // refused by cache.Eligible rather than keyed against a name whose meaning
  // can change under it. Empty means the engine's own environment, whose
  // digest its tier already reported (ADR 0021).
  string image = 10;
  // Executor kind this step must run on — "process", "kubernetes",
  // "containerd" — matched against the engine_types an engine registered.
  // Empty means any kind will do.
  //
  // Capability was the only lever before this: a pipeline that needed a pod
  // asked for NETWORK and hoped, and a step that had to run as a host process
  // could not be expressed at all. Both the planner and the dispatcher read
  // it straight off the step, so the placement they compute cannot disagree.
  string engine_type = 11;
  // How long this step may run before the engine kills it, in seconds. Zero
  // means unbounded, which is the only compatible default: every pipeline
  // written before this field existed carries none.
  //
  // It is a field rather than an environment variable because enforcement is
  // an ENGINE obligation and an environment variable is a step's own input:
  // a step could unset it, and an engine reading one would be taking its
  // timeout from the thing it is timing. The conformance suite passed
  // DHOLE_STEP_TIMEOUT_SECONDS in JobDispatch.env for exactly as long as
  // there was no field, and said so as a gap.
  //
  // Added in protocol version 3. An engine that negotiated 2 ignores it and
  // runs the step unbounded — see docs/wire-contract.md, "Step timeouts".
  uint32 timeout_seconds = 12;
}

// Edge connects one step's output port to another step's input port. The DAG
// is these edges; there is no separately authored dependency list to drift
// from them.
message Edge {
  string from_step = 1;
  string from_port = 2;
  string to_step = 3;
  string to_port = 4;
}

// Pipeline is a tenant-scoped set of steps and the edges between them.
message Pipeline {
  string id = 1;
  Tenant tenant = 2;
  repeated Step steps = 3;
  repeated Edge edges = 4;
}
