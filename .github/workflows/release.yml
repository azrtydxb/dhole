# Publishing a release. Triggered by a `v*` tag and by nothing else — a release
# that can be produced by a button is a release nobody can point at a commit.
#
# The gate runs first and the release job needs it. A tag whose tree does not
# pass `make check` and `make test` does not become a release: finding that out
# after the artifacts are on a registry is finding it out too late, because a
# published digest cannot be unpublished.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - name: check
        run: make check
      - name: test
        run: make test

  chart:
    name: chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # The chart's version and appVersion are rewritten from the tag before it
      # is linted, so what is linted is what would be published: a chart whose
      # appVersion points at a build that does not exist is worse than no chart.
      - name: pin the chart to this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${version}/" charts/dhole/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${version}\"/" charts/dhole/Chart.yaml
      - name: lint
        run: helm lint charts/dhole
      - name: template
        run: |
          helm template dhole charts/dhole > /dev/null
          helm template dhole charts/dhole \
            --set postgres.external=postgres://u:p@db:5432/dhole \
            --set nats.external=nats://nats:4222 \
            --set controlPlane.persistence.enabled=true > /dev/null
      - name: package
        run: helm package charts/dhole --destination dist-chart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helm-chart
          path: dist-chart/*.tgz

  release:
    name: release
    needs: [gate, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      packages: write # push images to ghcr.io
      id-token: write # keyless cosign signing through OIDC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      # QEMU so the arm64 image can be assembled on an amd64 runner. The
      # binaries themselves are cross-compiled by the Go toolchain and never
      # emulated; only the image layer assembly is.
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # syft produces the SPDX SBOMs goreleaser attaches to each archive.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The SBOM attestation on the IMAGE, which is a separate thing from the
      # SBOMs beside the archives: `cosign verify-attestation` reads this, and
      # `TestReleaseArtifactsAreSignedAndHaveSBOM` requires it.
      - name: attest an SPDX SBOM to each image
        env:
          COSIGN_YES: "true"
        run: |
          version="${GITHUB_REF_NAME#v}"
          for image in ghcr.io/azrtydxb/dhole ghcr.io/azrtydxb/dhole-engine; do
            ref="${image}:${version}"
            syft "$ref" -o spdx-json > sbom.spdx.json
            cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$ref"
          done

      # Prove the release verifies, from the workflow that made it, before
      # anybody is told it exists. A signature nobody has verified once is a
      # signature nobody knows how to verify.
      - name: verify what was just published
        run: |
          version="${GITHUB_REF_NAME#v}"
          for image in ghcr.io/azrtydxb/dhole ghcr.io/azrtydxb/dhole-engine; do
            ref="${image}:${version}"
            cosign verify "$ref" \
              --certificate-identity-regexp \
                '^https://github\.com/azrtydxb/dhole/\.github/workflows/release\.yml@' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            cosign verify-attestation "$ref" --type spdxjson \
              --certificate-identity-regexp \
                '^https://github\.com/azrtydxb/dhole/\.github/workflows/release\.yml@' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      # The same assertion the test in docs/ makes, run here against the images
      # that were just published. In CI it is the whole point; on a laptop it
      # skips, because there is nothing published to point it at.
      # goreleaser's {{ .Version }} has no leading v, so the image tag is
      # 1.2.3 where the git tag is v1.2.3. Getting that wrong makes the test
      # verify an image that does not exist, which fails loudly — but only
      # here, which is why it is spelled out rather than interpolated blind.
      - name: the signing test, against the real images
        env:
          DHOLE_RELEASE_IDENTITY_REGEXP: ^https://github\.com/azrtydxb/dhole/\.github/workflows/release\.yml@
          DHOLE_RELEASE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          export DHOLE_RELEASE_IMAGE="ghcr.io/azrtydxb/dhole:${GITHUB_REF_NAME#v}"
          go test ./docs/ -run TestReleaseArtifactsAreSignedAndHaveSBOM -v
