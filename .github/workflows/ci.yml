name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # amd64 and arm64 are both first-class targets, so the gate runs
        # natively on each rather than cross-compiling and skipping the tests.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: install golangci-lint
        # CI runs the same `make check` a developer runs, so the linter is
        # installed rather than invoked through a separate action.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
      - name: check
        run: make check
      - name: test
        run: make test
      - name: test (race)
        run: make test-race
      # Linux is the primary target and was the one platform NOT running the
      # compliance suite — macOS ran it and Windows deliberately does not. The
      # gap was not theoretical: a defect that made the suite reject engines
      # the contract permits shipped, and this job is where it would have been
      # caught. The reference engine needs python3 and a POSIX shell, both of
      # which every Linux runner has.
      - name: conformance
        run: make conformance ENGINE="python3 testdata/engines/minimal-python/engine.py"

  # The containerd executor (Task 36). It is a job of its own rather than a
  # step in the gate because it needs a container runtime and root: the ubuntu
  # runners already run containerd for Docker, so the "service" here is the
  # daemon the image ships with rather than a service container — a service
  # container could not expose its socket and its FIFO directory to the runner
  # at the paths the shim opens them by.
  #
  # It runs on every push rather than nightly because it is the only place the
  # containerd backend is executed at all: without it, internal/executor/
  # containerd is code that compiles and has never run, and the whole point of
  # the shared contract is that a backend is held to it by something other than
  # reading.
  containerd:
    name: containerd executor (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both architectures, for the same reason the gate runs on both: an
        # engine is shipped for each, and a runtime is exactly the kind of
        # dependency that behaves differently on one of them.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: start containerd
        run: |
          set -euo pipefail
          sudo systemctl start containerd
          # A socket that is not there yet is the difference between a real run
          # and a silent skip, so wait for it and fail loudly if it never came.
          for _ in $(seq 1 30); do
            [ -S /run/containerd/containerd.sock ] && break
            sleep 1
          done
          sudo ctr version
      # sudo, because the socket and the exec FIFOs under /run/containerd are
      # root's. Only this package is run as root: the rest of the suite has
      # tests about unreadable files, and root can read them.
      - name: executor contract
        run: |
          sudo --preserve-env=PATH env \
            DHOLE_TEST_CONTAINERD_SOCK=/run/containerd/containerd.sock \
            "$(command -v go)" test ./internal/executor/containerd/... -count=1 -v -timeout 20m \
            2>&1 | tee containerd-test.log
      # These tests skip themselves when the socket is missing, and a skip is
      # invisible in a green job. This job exists to run them.
      - name: refuse a run that only skipped
        run: |
          set -euo pipefail
          if grep -q -- '--- SKIP: TestContainerdExecutorContract' containerd-test.log; then
            echo "::error::the containerd executor contract skipped; this job exists to run it, not to report a pass nobody earned"
            exit 1
          fi

  # The VM executor (Task 53). It needs a hypervisor with hardware
  # acceleration, which is a harder ask than a container runtime: GitHub's
  # x64 Linux runners expose /dev/kvm through nested virtualisation, and their
  # arm64 runners do not, so this job is amd64-only where the containerd job
  # is a matrix over both.
  #
  # It runs on every push for the same reason the containerd job does. Without
  # it internal/executor/vm is code that compiles and has never booted a guest,
  # and the point of the shared contract is that a backend is held to it by
  # something other than reading.
  vm:
    name: vm executor (firecracker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      # /dev/kvm exists on these runners but is owned by root with no group
      # access, so the tests would skip themselves on a machine that can
      # actually run them.
      - name: enable KVM for the runner user
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: install a static busybox
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox-static cpio
      - name: fetch firecracker and a guest kernel
        env:
          FC_VERSION: v1.13.1
        run: |
          set -euo pipefail
          mkdir -p /opt/vm
          curl -sSL -o /tmp/fc.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          tar -xzf /tmp/fc.tgz -C /tmp
          install -m 0755 "/tmp/release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" /opt/vm/firecracker
          # A kernel built for virtio-mmio with no PCI bus, which is what both
          # Firecracker and QEMU's microvm machine present.
          curl -sSL -o /opt/vm/vmlinux \
            https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/v1.11/x86_64/vmlinux-6.1.102
      # The rootfs is an initramfs whose init IS the guest agent. busybox must
      # be the STATIC build: a dynamically linked one in a rootfs with no libc
      # fails as `exec: "sh": executable file not found in $PATH`, which reads
      # as a missing program rather than a missing loader.
      - name: build the guest rootfs
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /opt/vm/root/init ./internal/executor/vm/agent
          mkdir -p /opt/vm/root/bin /opt/vm/root/proc /opt/vm/root/sys /opt/vm/root/dev \
                   /opt/vm/root/tmp /opt/vm/root/dhole/work
          cp /usr/bin/busybox /opt/vm/root/bin/busybox
          for applet in sh sleep id printf cat ls seq env mkdir rm sync cp mv touch dd head tail grep wc true false; do
            ln -sf /bin/busybox "/opt/vm/root/bin/$applet"
          done
          ( cd /opt/vm/root && find . | cpio -o -H newc --quiet | gzip -1 > /opt/vm/rootfs.cpio.gz )
      - name: executor contract
        # DHOLE_TEST_QEMU_BIN is deliberately NOT set, and the QEMU half of the
        # suite therefore skips here. The QEMU backend needs a guest kernel
        # with vsock built IN, and neither kernel this job could reach has
        # that: the Firecracker CI kernel does not boot on QEMU's machine
        # models at all (it resets before printing a line, even with
        # earlycon), and a distro kernel that does boot ships vsock as a
        # loadable module the initramfs does not carry. Setting the variable
        # anyway would turn a known gap into a red job that says nothing new.
        # See docs/executors/vm.md.
        env:
          DHOLE_TEST_FIRECRACKER_BIN: /opt/vm/firecracker
          DHOLE_TEST_VM_KERNEL: /opt/vm/vmlinux
          DHOLE_TEST_VM_ROOTFS: /opt/vm/rootfs.cpio.gz
        run: |
          go test ./internal/executor/vm/... -count=1 -v -timeout 25m 2>&1 | tee vm-test.log
      # These tests skip themselves when there is no hypervisor, and a skip is
      # invisible in a green job. This job exists to run them.
      - name: refuse a run that only skipped
        run: |
          set -euo pipefail
          if grep -q -- '--- SKIP: TestVMExecutorContract' vm-test.log; then
            echo "::error::the VM executor contract skipped; this job exists to run it, not to report a pass nobody earned"
            exit 1
          fi
      - name: guest consoles
        if: failure()
        run: |
          # A guest that never reached its agent left its reason on the serial
          # console, and nothing else in the log says why.
          find /tmp -name console.log -newermt '-30 minutes' -print -exec tail -40 {} \; 2>/dev/null || true

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        run: npm ci
        working-directory: web
      # web-check skips when node_modules is absent, which is right for the Go
      # gate and wrong here — this job exists to run it, so it installs first.
      - name: check
        run: make web-check
      - name: install browsers
        run: npx playwright install --with-deps chromium
        working-directory: web
      # The end-to-end suite starts a real `dhole serve`, so it needs the Go
      # toolchain as well as the browser. It is deliberately not part of
      # `make check`.
      - name: e2e
        run: make web-e2e

  # The macOS and Windows engines (Task 54). The gate above runs on Linux
  # only, so without these two jobs the build-tagged halves of
  # internal/executor/process are files nobody ever compiles, let alone runs.
  engine-macos:
    name: engine (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      # The executor contract is where the property that matters lives: a
      # cancelled step leaves nothing running, and a killed step reports 137.
      - name: executor tests
        run: go test ./internal/executor/...
      # macOS carries python3 and a POSIX shell, so the reference engine and
      # the suite's cases both run here exactly as they do on Linux.
      - name: conformance
        run: make conformance ENGINE="python3 testdata/engines/minimal-python/engine.py"

  engine-windows:
    name: engine (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # bash, because the Makefile and these commands are POSIX shell. Git's
        # bash is on every Windows runner.
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      # This is the first time the Job Object engine is executed rather than
      # merely compiled: process_windows.go is unreachable from any other job.
      - name: executor tests
        run: go test ./internal/executor/...
      # `make conformance` is deliberately NOT run here, and the reason is not
      # the Makefile. The reference engine in testdata/engines/minimal-python
      # is POSIX-only — it calls os.killpg/os.getpgid, neither of which exists
      # on Windows, and shells out to `rm -rf` — and every case in
      # conformance/cases.go dispatches a POSIX `sh -c` command using sleep,
      # printf and tr. Running it here would fail on the fixtures rather than
      # on the engine under test, which would say nothing about Windows.
      # Enabling it needs a Windows-capable reference engine and
      # shell-neutral cases; until then this job proves what it can.
