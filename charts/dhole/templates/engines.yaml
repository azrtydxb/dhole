{{/*
One Deployment per trust tier.

An engine dials the bus and opens no port, so there is no Service here and
nothing to expose.

BUS CREDENTIALS. This comment used to claim an engine's credentials permit its
own tier only. They did not: the chart handed every engine the same
`dhole.busURL`, which for the in-chart NATS carries no credentials at all and
for an external cluster carried whatever the operator put in `nats.external` —
in practice the tenant's ACCOUNT credential, which reaches every tier's
`job.dispatch.>` because the control plane publishes to all of them. Tier
isolation was then the engine's own choice of filter subject.

`busCredentialsSecret` on a tier is where the real thing goes: a Secret holding
the tier-scoped URL the control plane issues for that tenant and tier (see
docs/deployment.md). With it set, an engine in the untrusted tier that binds
the trusted tier's dispatch subjects gets a permissions error from the server.
Without it the engine falls back to the shared URL and the tier is a label —
the install notes say so.
*/}}
{{- range .Values.engines }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dhole.fullname" $ }}-engine-{{ .name }}
  labels:
    {{- include "dhole.labels" $ | nindent 4 }}
    app.kubernetes.io/component: engine
    dhole.dev/tier: {{ .tier | quote }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "dhole.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: engine
      dhole.dev/engine: {{ .name | quote }}
  template:
    metadata:
      labels:
        {{- include "dhole.labels" $ | nindent 8 }}
        app.kubernetes.io/component: engine
        dhole.dev/engine: {{ .name | quote }}
        dhole.dev/tier: {{ .tier | quote }}
    spec:
      serviceAccountName: {{ include "dhole.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- $podSecurity := deepCopy $.Values.podSecurityContext }}
        {{- /*
          A vm engine opens /dev/kvm, and on every distribution that device is
          root:kvm 0660 — the engine runs as 65532:0 and gets EACCES. On kw the
          step failed with firecracker's own words: "Error creating KVM object:
          Permission denied (os error 13) Make sure the user launching the
          firecracker process is configured on the /dev/kvm file's ACL". The
          kvm device plugin hands the pod the DEVICE and says nothing about who
          may open it, so this group is what closes the gap.

          The gid is the NODE's, not the container's, and distributions differ
          (994 on Armbian noble, 108 on Debian, 36 on Fedora), so it cannot be
          defaulted here — a wrong gid silently grants nothing. `kvmGroup` on
          the tier is where an operator says which one, and an engine that is
          not vm-backed never needs it.
        */}}
        {{- if .kvmGroup }}
        {{- $podSecurity = merge (dict "supplementalGroups" (append (default list $podSecurity.supplementalGroups) (int .kvmGroup))) $podSecurity }}
        {{- end }}
        {{- toYaml $podSecurity | nindent 8 }}
      # An engine stopped mid-step leaves its dispatch unacknowledged, and it
      # comes back to somebody else. Long enough for the step to finish is
      # better for everyone than long enough for nothing.
      terminationGracePeriodSeconds: 120
      containers:
        - name: engine
          {{- $image := .image | default dict }}
          image: {{ $.Values.image.registry }}/{{ $image.repository | default "azrtydxb/dhole-engine" }}:{{ $image.tag | default $.Chart.AppVersion }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            {{- /*
              The tier's OWN credential when the operator has issued one. It is
              a Secret rather than a value because it carries a password, and
              it is per tier because a credential whose scope the holder
              chooses is not a boundary — the plane names the tier when it
              issues this, and DHOLE_TIER below only decides which queue this
              engine tries to pull.
            */}}
            {{- if .busCredentialsSecret }}
            - name: DHOLE_BUS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .busCredentialsSecret.name | required (printf "engines[%s].busCredentialsSecret.name is required when busCredentialsSecret is set" .name) }}
                  key: {{ .busCredentialsSecret.key | default "bus-url" | quote }}
            {{- else }}
            - name: DHOLE_BUS_URL
              value: {{ include "dhole.busURL" $ | quote }}
            {{- end }}
            # The engine id must be unique per process: it is the subject its
            # control messages arrive on. The pod name is the one identifier
            # Kubernetes guarantees is unique and stable for a pod's life.
            - name: DHOLE_ENGINE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DHOLE_TIER
              value: {{ .tier | quote }}
            - name: DHOLE_SLOTS
              value: {{ .slots | default 1 | quote }}
            - name: DHOLE_STATE_DIR
              value: /var/lib/dhole-engine
            {{- include "dhole.objectStoreEnv" $ | nindent 12 }}
            - name: DHOLE_EXECUTOR
              value: {{ .executor | default "kubernetes" | quote }}
            {{- if eq (.executor | default "kubernetes") "kubernetes" }}
            {{- $sandbox := .sandbox | default dict }}
            - name: DHOLE_SANDBOX_NAMESPACE
              value: {{ $sandbox.namespace | default $.Release.Namespace | quote }}
            {{- with $sandbox.serviceAccount }}
            - name: DHOLE_SANDBOX_SERVICE_ACCOUNT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- /*
              A backend's own configuration. The kubernetes backend needs a
              namespace and the vm backend needs a kernel, a rootfs and a
              hypervisor path (DHOLE_VM_*, see docs/executors/vm.md) — and a
              chart that named every backend's variables would have to be
              edited for each new one. This passes a tier's own settings
              through instead, so a backend added later needs no chart change.
            */}}
            {{- range $name, $value := .env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/dhole-engine
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
