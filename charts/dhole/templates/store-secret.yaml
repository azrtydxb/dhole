{{/*
The store DSN, in a Secret because it carries a password.

An external DSN is taken verbatim. Otherwise the in-chart Postgres is addressed,
with a password generated on first install and PRESERVED on upgrade: regenerating
it would leave the plane unable to reach the database it just deployed, which is
the classic way a Helm upgrade takes an application down for reasons nothing logs.
*/}}
{{- if not .Values.postgres.existingSecret }}
{{- $name := printf "%s-store" (include "dhole.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.postgres.password }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dhole.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  {{- if .Values.postgres.external }}
  dsn: {{ .Values.postgres.external | quote }}
  {{- else }}
  dsn: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.user $password (include "dhole.fullname" .) .Values.postgres.database | quote }}
  {{- end }}
{{- end }}
