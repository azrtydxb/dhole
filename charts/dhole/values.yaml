# Default values for the Dhole chart.
#
# The defaults deploy something that WORKS and is not something to run a
# business on: an in-chart Postgres and an in-chart NATS, both single-replica
# with ephemeral storage. That is deliberate — a chart whose defaults fail
# teaches nothing, and a chart whose defaults quietly look production-ready
# teaches something false. Point `postgres.external` and `nats.external` at real
# ones before this matters.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: azrtydxb/dhole
  # Empty means the chart's appVersion, which the release workflow pins to the
  # tag. A floating tag here would make two installs of "the same" chart run
  # different code.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

controlPlane:
  replicas: 1
  # Two control planes may share a database — that is what lets both drain the
  # same outbox backlog. They must then share a deployment id, and MUST NOT
  # share one with a different deployment: an outbox row is addressed to one
  # plane's bus. Empty derives it from the state directory.
  deploymentID: ""
  apiPort: 7777
  # A browser origin allowed to make cross-origin API calls. Repeatable.
  allowedOrigins: []
  otlpEndpoint: ""
  otlpInsecure: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # The state directory holds the CAS and the blob store. emptyDir is fine for
  # a trial and wrong for anything else: it is discarded when the pod moves.
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""
  # The credentials the control plane redeems for its OWN model calls — the
  # API key a `builtin:llm` step names in its `api_key_secret` (ADR 0024).
  #
  # The VALUE is never here. Each entry names an existing Kubernetes Secret to
  # read it from, because a key in this file is a key in the rendered manifest,
  # in every GitOps repository and in every `kubectl describe` a support ticket
  # asks for. The plane holds no value at rest either: it mints a handle
  # through its own broker per call and spends it.
  #
  # - name: ANTHROPIC_API_KEY      # what a step's `api_key_secret` names
  #   existingSecret: anthropic    # the Secret holding the value
  #   key: apiKey                  # the key within it (default "apiKey")
  modelSecrets: []
  # The secrets a pipeline STEP may declare (ADR 0027, docs/secrets.md). A step
  # names one in its `secrets:` and sees the value in the environment variable
  # it binds it to; the engine redeems a short-lived handle for it at exec time.
  #
  # These are separate from modelSecrets on purpose: a model credential is not
  # readable by pipeline steps unless it is listed here as well. The tenant is
  # required even with one tenant — a step secret belongs to exactly one — and
  # as with modelSecrets the VALUE is never in this file.
  #
  # - name: harbor-robot            # what a step's `secrets[].name` declares
  #   tenant: default               # the tenant whose steps may declare it
  #   existingSecret: harbor-robot  # the Secret holding the value
  #   key: password                 # the key within it (required)
  secrets: []
  # The dispatch policy every step, and every secret a step declares, is
  # decided by before it runs (ADR 0012, 0030, 0032; docs/policy.md). Every
  # decision, allows included, is recorded in the policy_audit table.
  #
  # Leave both unset and the plane runs the built-in default, which permits
  # every step and every secret: `dhole policy default` prints it. Set ONE of
  # them to replace it whole — write the rules inline, or name a ConfigMap you
  # manage. Test a policy with `dhole policy test --policy FILE` first.
  #
  # Whichever is in force sits above a floor no policy relaxes: tainted data
  # does not reach a non-PURE step or a PRIVILEGED engine, and the `untrusted`
  # tier runs nothing unsigned, privileged or at-most-once.
  #
  # The plane re-reads the file every 10s, so an edited ConfigMap takes effect
  # without a restart once Kubernetes has updated the mount. A change that
  # does not compile is logged and the policy in force stays; at start-up, an
  # invalid policy stops the plane.
  policy:
    # rules: |
    #   revision: ops/1
    #   rules:
    #     - id: signing-key-for-releases-only
    #       expression: 'input.secret_name != "release-signing-key" || input.tier == "release"'
    #       reason: only the release tier may read the signing key
    rules: ""
    # existingConfigMap: platform-dispatch-policy
    existingConfigMap: ""
    # The key within the ConfigMap that holds the policy document.
    key: policy.yaml
  nodeSelector: {}
  tolerations: []
  affinity: {}

engines:
  # One entry per trust tier. A tier is a deployment decision rather than a
  # label — but only if the engine's bus credential says so. See
  # busCredentialsSecret below.
  - name: trusted
    tier: trusted
    replicas: 1
    slots: 2
    # The Secret holding this tier's own bus URL, issued by the control plane
    # for one tenant and one tier (`dhole` tenancy provisioning —
    # Provisioner.EngineCredentials; see docs/deployment.md).
    #
    # UNSET means this engine dials the shared nats.external / in-chart URL,
    # which reaches every tier's job.dispatch.> — the tier is then nothing but
    # this engine's own choice of filter subject. That is the default because
    # the chart cannot mint a credential before the plane is running, not
    # because it is safe; the install notes warn for every tier without one.
    #
    #   busCredentialsSecret:
    #     name: dhole-engine-trusted-bus
    #     key: bus-url
    busCredentialsSecret: {}
    # kubernetes | process. The default is not the binary's default, and the
    # difference is the point: the engine image is distroless, so it has no
    # shell and no interpreter, and the process backend can therefore execute
    # nothing at all inside this chart. A step here runs in a sandbox pod.
    # Choose process only for an engine whose image you have made able to run
    # your steps directly.
    executor: kubernetes
    # A backend's own settings, passed through as environment variables. The
    # vm backend reads DHOLE_VM_KERNEL, DHOLE_VM_ROOTFS and DHOLE_VM_HYPERVISOR
    # from here; see docs/executors/vm.md. Empty for the kubernetes backend,
    # which needs only the sandbox block below.
    env: {}
    # The gid of the node's `kvm` group, for a vm-backed engine only.
    #
    # The kvm device plugin hands the pod /dev/kvm and says nothing about who
    # may open it: the device is root:kvm 0660 and the engine runs as 65532:0,
    # so firecracker fails with "Permission denied ... configured on the
    # /dev/kvm file's ACL" and every step on that engine fails to acquire a
    # sandbox. This adds the group so the open succeeds.
    #
    # It is the NODE's gid and distributions disagree — 994 on Armbian noble,
    # 108 on Debian, 36 on Fedora — so there is no safe default: a wrong number
    # grants nothing and fails exactly as before. Read it on a node with
    # `stat -c %g /dev/kvm`.
    kvmGroup: null
    sandbox:
      # Where sandbox pods are created. Empty means the release namespace.
      namespace: ""
      # The identity sandbox pods run as. Empty leaves the namespace default,
      # which is what you want unless the steps themselves need credentials.
      serviceAccount: ""
      # What each sandbox pod's step container may take — one pod per running
      # step, so up to `slots` of them per engine at once.
      #
      # UNSET, a sandbox pod has no requests and no limits. The scheduler then
      # counts it as free and packs it anywhere, and a `go build` takes the
      # whole node: on kw the engine sharing that node took 36 seconds to pick
      # up its next dispatch, past the 30 second lease, and the plane declared
      # a live attempt lost and ran it again. Set this for any tier that runs
      # real builds.
      #
      # Sizing is per tier and belongs to the operator; a pipeline cannot ask
      # for more. A step that needs a bigger pod belongs on a tier sized for it.
      #
      # Size it against the node, with the engine's own request below intact:
      #   slots x limits.cpu + resources.requests.cpu <= the node's allocatable CPU
      # so a tier running every slot flat out still leaves the engine the CPU it
      # asked for. Memory the same way, or a step's OOM becomes the engine's.
      #
      # A limit with no request makes Kubernetes use the limit as the request.
      # A value the engine cannot parse, a negative one, or a request above its
      # limit stops the engine at startup rather than being ignored. With this
      # set, a LimitRange in the sandbox namespace is no longer needed.
      #
      #   resources:
      #     requests: { cpu: 500m, memory: 512Mi }
      #     limits: { cpu: "2", memory: 4Gi }
      resources: {}
    image:
      repository: azrtydxb/dhole-engine
      tag: ""
    # The engine's OWN pod. Its CPU request is what protects it from the steps
    # it runs: the scheduler reserves it on the node, and a contended node
    # shares CPU in proportion to requests. It has to stay responsive enough
    # to renew leases, stream step logs and move artifacts in and out of its
    # sandboxes; 500m is that with margin, where 200m was a floor. Keep the
    # rule under sandbox.resources above true when you change either.
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { memory: 2Gi }

objectStore:
  # Where step logs and artifacts live.
  #
  # filesystem | s3. The filesystem store is PER POD and therefore not shared:
  # an engine writes a step's log and outputs to its own disk, and the control
  # plane — which is a different pod — cannot read them. Every step succeeds
  # and nothing it produced is reachable, which is a hard failure to see. Use
  # s3 for any deployment with an engine outside the control plane's pod.
  kind: filesystem
  s3:
    bucket: ""
    # Empty for AWS itself; set for MinIO or any other S3-compatible server.
    endpoint: ""
    region: ""
    # A Secret with keys accessKeyId and secretAccessKey. Leave empty to use
    # the ambient AWS credential chain (IRSA, instance role), which is how a
    # cloud deployment avoids carrying static keys.
    existingSecret: ""

postgres:
  # external: a DSN this chart does not manage. Set it for anything real.
  external: ""
  enabled: true
  image: postgres:17-alpine
  database: dhole
  user: dhole
  # Generated on first install when empty. Held in a Secret either way.
  password: ""
  existingSecret: ""
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""

nats:
  # external: a nats:// URL this chart does not manage.
  external: ""
  enabled: true
  image: nats:2.12-alpine
  jetstream:
    enabled: true
    storageSize: 10Gi
  persistence:
    enabled: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 7777
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
commonLabels: {}
