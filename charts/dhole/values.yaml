# Default values for the Dhole chart.
#
# The defaults deploy something that WORKS and is not something to run a
# business on: an in-chart Postgres and an in-chart NATS, both single-replica
# with ephemeral storage. That is deliberate — a chart whose defaults fail
# teaches nothing, and a chart whose defaults quietly look production-ready
# teaches something false. Point `postgres.external` and `nats.external` at real
# ones before this matters.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repository: azrtydxb/dhole
  # Empty means the chart's appVersion, which the release workflow pins to the
  # tag. A floating tag here would make two installs of "the same" chart run
  # different code.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

controlPlane:
  replicas: 1
  # Two control planes may share a database — that is what lets both drain the
  # same outbox backlog. They must then share a deployment id, and MUST NOT
  # share one with a different deployment: an outbox row is addressed to one
  # plane's bus. Empty derives it from the state directory.
  deploymentID: ""
  apiPort: 7777
  # A browser origin allowed to make cross-origin API calls. Repeatable.
  allowedOrigins: []
  otlpEndpoint: ""
  otlpInsecure: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # The state directory holds the CAS and the blob store. emptyDir is fine for
  # a trial and wrong for anything else: it is discarded when the pod moves.
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""
  # The credentials the control plane redeems for its OWN model calls — the
  # API key a `builtin:llm` step names in its `api_key_secret` (ADR 0024).
  #
  # The VALUE is never here. Each entry names an existing Kubernetes Secret to
  # read it from, because a key in this file is a key in the rendered manifest,
  # in every GitOps repository and in every `kubectl describe` a support ticket
  # asks for. The plane holds no value at rest either: it mints a handle
  # through its own broker per call and spends it.
  #
  # - name: ANTHROPIC_API_KEY      # what a step's `api_key_secret` names
  #   existingSecret: anthropic    # the Secret holding the value
  #   key: apiKey                  # the key within it (default "apiKey")
  modelSecrets: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

engines:
  # One entry per trust tier. An engine's bus credentials permit its own tier
  # only, so a tier is a deployment decision rather than a label.
  - name: trusted
    tier: trusted
    replicas: 1
    slots: 2
    # kubernetes | process. The default is not the binary's default, and the
    # difference is the point: the engine image is distroless, so it has no
    # shell and no interpreter, and the process backend can therefore execute
    # nothing at all inside this chart. A step here runs in a sandbox pod.
    # Choose process only for an engine whose image you have made able to run
    # your steps directly.
    executor: kubernetes
    # A backend's own settings, passed through as environment variables. The
    # vm backend reads DHOLE_VM_KERNEL, DHOLE_VM_ROOTFS and DHOLE_VM_HYPERVISOR
    # from here; see docs/executors/vm.md. Empty for the kubernetes backend,
    # which needs only the sandbox block below.
    env: {}
    sandbox:
      # Where sandbox pods are created. Empty means the release namespace.
      namespace: ""
      # The identity sandbox pods run as. Empty leaves the namespace default,
      # which is what you want unless the steps themselves need credentials.
      serviceAccount: ""
    image:
      repository: azrtydxb/dhole-engine
      tag: ""
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 2Gi }

objectStore:
  # Where step logs and artifacts live.
  #
  # filesystem | s3. The filesystem store is PER POD and therefore not shared:
  # an engine writes a step's log and outputs to its own disk, and the control
  # plane — which is a different pod — cannot read them. Every step succeeds
  # and nothing it produced is reachable, which is a hard failure to see. Use
  # s3 for any deployment with an engine outside the control plane's pod.
  kind: filesystem
  s3:
    bucket: ""
    # Empty for AWS itself; set for MinIO or any other S3-compatible server.
    endpoint: ""
    region: ""
    # A Secret with keys accessKeyId and secretAccessKey. Leave empty to use
    # the ambient AWS credential chain (IRSA, instance role), which is how a
    # cloud deployment avoids carrying static keys.
    existingSecret: ""

postgres:
  # external: a DSN this chart does not manage. Set it for anything real.
  external: ""
  enabled: true
  image: postgres:17-alpine
  database: dhole
  user: dhole
  # Generated on first install when empty. Held in a Secret either way.
  password: ""
  existingSecret: ""
  persistence:
    enabled: false
    size: 20Gi
    storageClass: ""

nats:
  # external: a nats:// URL this chart does not manage.
  external: ""
  enabled: true
  image: nats:2.12-alpine
  jetstream:
    enabled: true
    storageSize: 10Gi
  persistence:
    enabled: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 7777
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podAnnotations: {}
commonLabels: {}
