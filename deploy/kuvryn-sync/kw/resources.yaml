apiVersion: apps/v1
kind: Deployment
metadata:
  name: dhole-nats
  namespace: dhole
  labels:
    app.kubernetes.io/component: nats
    app.kubernetes.io/instance: dhole
    app.kubernetes.io/managed-by: kuvryn-sync
    app.kubernetes.io/name: dhole
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: dhole-0.1.0
  annotations:
    sync.kuvryn.io/prune: disabled
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: nats
      app.kubernetes.io/instance: dhole
      app.kubernetes.io/name: dhole
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: nats
        app.kubernetes.io/instance: dhole
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: dhole
        app.kubernetes.io/version: 0.1.0
        helm.sh/chart: dhole-0.1.0
    spec:
      containers:
      - args:
        - -c
        - /etc/nats/nats.conf
        image: nats:2.12-alpine
        imagePullPolicy: IfNotPresent
        name: nats
        ports:
        - containerPort: 4222
          name: client
          protocol: TCP
        - containerPort: 8222
          name: monitor
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: monitor
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/nats
          name: config
        - mountPath: /data
          name: data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: dhole-nats
        name: config
      - emptyDir: {}
        name: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dhole-postgres
  namespace: dhole
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/instance: dhole
    app.kubernetes.io/managed-by: kuvryn-sync
    app.kubernetes.io/name: dhole
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: dhole-0.1.0
  annotations:
    sync.kuvryn.io/prune: disabled
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      app.kubernetes.io/instance: dhole
      app.kubernetes.io/name: dhole
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        app.kubernetes.io/instance: dhole
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: dhole
        app.kubernetes.io/version: 0.1.0
        helm.sh/chart: dhole-0.1.0
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: dhole
        - name: POSTGRES_USER
          value: dhole
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: dhole-store
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:17-alpine
        imagePullPolicy: IfNotPresent
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        readinessProbe:
