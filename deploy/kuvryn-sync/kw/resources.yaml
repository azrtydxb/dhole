apiVersion: apps/v1
kind: Deployment
metadata:
  name: dhole
  namespace: dhole
  labels:
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/instance: dhole
    app.kubernetes.io/managed-by: kuvryn-sync
    app.kubernetes.io/name: dhole
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: dhole-0.1.0
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
      app.kubernetes.io/instance: dhole
      app.kubernetes.io/name: dhole
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/instance: dhole
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: dhole
        app.kubernetes.io/version: 0.1.0
        helm.sh/chart: dhole-0.1.0
    spec:
      containers:
      - args:
        - serve
        - --mode=distributed
        - --bus-url=$(DHOLE_BUS_URL)
        - --store-dsn=$(DHOLE_STORE_DSN)
        - --blob-root=/var/lib/dhole
        - --api-addr=0.0.0.0:7777
        - --secret=default/nexus-push=DHOLE_STEP_SECRET_0
        env:
        - name: DHOLE_BUS_URL
          value: nats://dhole-nats:4222
        - name: DHOLE_STORE_DSN
          valueFrom:
            secretKeyRef:
              key: dsn
              name: dhole-store
        - name: DHOLE_OBJECT_STORE
          value: s3
        - name: DHOLE_S3_BUCKET
          value: dhole
        - name: DHOLE_S3_ENDPOINT
          value: http://minio.dhole-test.svc.cluster.local:9000
        - name: DHOLE_S3_REGION
          value: us-east-1
        - name: DHOLE_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: accessKeyId
              name: dhole-s3
        - name: DHOLE_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: secretAccessKey
              name: dhole-s3
        - name: DHOLE_S3_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              key: sessionToken
              name: dhole-s3
              optional: true
        - name: DHOLE_STEP_SECRET_0
          valueFrom:
            secretKeyRef:
              key: password
              name: nexus-push
        image: 192.168.10.131/azrtydxb/dhole:eb1fbec
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: api
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: dhole
        ports:
        - containerPort: 7777
          name: api
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: api
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/dhole
          name: state
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccount: dhole
      serviceAccountName: dhole
      terminationGracePeriodSeconds: 90
      volumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: state
---
