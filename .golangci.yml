version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - revive
  exclusions:
    rules:
      # Tests assert on error-returning helpers through require; the gosec
      # rules about file permissions and subprocesses target production paths.
      - path: _test\.go$
        linters:
          - gosec
