# The automation acceptance pipeline: the profile ADR 0016 calls "schedule and
# API triggers, a long wait, execution across more than one engine type".
#
# The three steps are three different things about this system:
#
#   host    runs on whatever engine has no special capability — on this
#           deployment the process engine the single binary hosts — and
#           reports the kernel it saw, so the test can tell WHERE it ran
#           instead of trusting where it was meant to run.
#   hold    is never executed at all. It is a `builtin:wait` step: reaching
#           it arms a durable timer, which is a ROW, so the run's position
#           lives in the log and the wait costs nothing while a control plane
#           is stopped and restarted underneath it (ADR 0003). Its `token`
#           output is deliberately empty — the edge exists to order the graph,
#           and a gate produces no artifact.
#   cluster declares CAPABILITY_NETWORK, which the host-process backend does
#           not advertise and the Kubernetes one does. That capability is the
#           ONLY thing in this system that can route a step to an engine
#           kind: the dispatch subject is job.dispatch.<tier>.<caps-hash>,
#           and only an engine that can satisfy the set subscribes to it.
#
# `event` on the first step is the pipeline's one declared input — a free
# input port, which is what a trigger binds to (ADR 0007). Both the cron
# schedule and the webhook fill it. Nothing carries it INTO the run yet; see
# the finding recorded with this task.
id: acceptance-automation
tenant:
  id: default
steps:
  # This step used to sleep for five seconds, and the sleep was a FINDING
  # wearing a workaround: arming the wait below was not atomic with the
  # scheduler's readiness decision, so an Advance that read the run's state
  # before the arming transaction committed dispatched the gated step anyway.
  # The gate is now a step type, armed by the same act that finds it ready and
  # recognised from the pinned definition rather than from the log, so there is
  # no interval left to lose and no reason to hold the gate out of reach.
  - id: host
    name: probe the host engine
    plugin_ref: 'command:{"args":["/bin/sh","-c","uname -s > probe"]}'
    effect_class: EFFECT_CLASS_PURE
    inputs:
      - name: event
        type:
          structured:
            schema_id: dhole:acceptance/trigger-event
            schema: '{"type":"string"}'
    outputs:
      - name: probe
        type:
          blob:
            media_type: text/plain
  - id: hold
    name: wait for the timer
    plugin_ref: builtin:wait
    effect_class: EFFECT_CLASS_PURE
    config:
      # Longer than a control-plane restart takes, because the point of this
      # wait is that it OUTLIVES one: a wait that had already elapsed before
      # the second plane existed would still fire, correctly, and would no
      # longer be evidence that a plane inherited an outstanding wait.
      duration: 30s
    inputs:
      - name: probe
        type:
          blob:
            media_type: text/plain
    outputs:
      - name: token
        type:
          blob:
            media_type: text/plain
  - id: cluster
    name: probe the kubernetes engine
    plugin_ref: 'command:{"args":["/bin/sh","-c","uname -s > probe"]}'
    effect_class: EFFECT_CLASS_PURE
    capabilities:
      - CAPABILITY_NETWORK
    inputs:
      - name: token
        type:
          blob:
            media_type: text/plain
    outputs:
      - name: probe
        type:
          blob:
            media_type: text/plain
edges:
  - from_step: host
    from_port: probe
    to_step: hold
    to_port: probe
  - from_step: hold
    from_port: token
    to_step: cluster
    to_port: token
